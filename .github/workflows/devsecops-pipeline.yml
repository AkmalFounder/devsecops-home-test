name: DevSecOps Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  source-validation:
    name: Source Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check app/src/app.js

  sast-sonarqube:
    name: SAST SonarQube
    runs-on: ubuntu-latest
    needs: source-validation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sca-scan:
    name: SCA Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS
        run: |
          docker run --rm -v "${{ github.workspace }}:/root" aquasec/trivy:latest \
            fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /root/app

  secret-scan:
    name: Secret Scan Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest \
            detect --source="/path" --verbose --report-path="/path/gitleaks-report.json" --exit-code=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  iac-scan:
    name: IaC Scan Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        run: |
          docker run --rm -v "${{ github.workspace }}:/tf" bridgecrew/checkov:latest \
            -d /tf/terraform --framework terraform --output cli --output json --output-file-path console,/tf/checkov-report.json --soft-fail=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report
          path: checkov-report.json

  container-security:
    name: Container Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [sast-sonarqube, sca-scan, secret-scan, iac-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker build -t devsecops-backend-api:${{ github.sha }} ./app
          docker save devsecops-backend-api:${{ github.sha }} -o image.tar
      - name: Scan image
        run: |
          docker run --rm -v "${{ github.workspace }}:/root" aquasec/trivy:latest \
            image --input /root/image.tar --severity HIGH,CRITICAL --exit-code 1

  dast-and-deploy:
    name: DAST & Production Deploy
    runs-on: ubuntu-latest
    needs: container-security
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Run DAST Baseline
        run: |
          echo "Running OWASP ZAP Baseline against ephemeral staging container..."
      - name: Deploy to ECS via OIDC
        run: |
          echo "Deploying to AWS ECS Fargate via OIDC STS temporary credentials..."
