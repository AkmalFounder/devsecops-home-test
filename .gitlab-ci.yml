stages:
  - validate
  - sast
  - sca
  - secrets
  - iac-scan
  - build
  - container-scan
  - dast-and-deploy

default:
  interruptible: true

variables:
  DOCKER_IMAGE_NAME: "$CI_REGISTRY_IMAGE/backend-api:$CI_COMMIT_SHORT_SHA"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # SonarQube configuration
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

source_validation:
  stage: validate
  image: node:20-alpine
  script:
    - cd app
    - node --check src/app.js
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'

sast_sonarqube:
  stage: sast
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}"
      -Dsonar.token="${SONAR_TOKEN}"
      -Dsonar.qualitygate.wait=true
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'

sca_dependency_scan:
  stage: sca
  image: aquasec/trivy:latest
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table -o sca-report.txt app/
  artifacts:
    name: "sca-report-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - sca-report.txt
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'

secret_scanning_gitleaks:
  stage: secrets
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source=. --verbose --report-path=gitleaks-report.json --exit-code=1
  artifacts:
    name: "gitleaks-report-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'

iac_checkov_scan:
  stage: iac-scan
  image: bridgecrew/checkov:latest
  script:
    - checkov -d terraform/ --framework terraform --output cli --output json --output-file-path console,checkov-report.json --soft-fail=false
  artifacts:
    name: "iac-report-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - checkov-report.json
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'

docker_build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - cd app
    - docker build -t $DOCKER_IMAGE_NAME .
    - docker save $DOCKER_IMAGE_NAME -o ../image.tar
  artifacts:
    name: "docker-image-$CI_COMMIT_SHORT_SHA"
    paths:
      - image.tar
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"'

container_vulnerability_scan:
  stage: container-scan
  image: aquasec/trivy:latest
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1 --format table -o container-scan-report.txt
  artifacts:
    name: "container-scan-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - container-scan-report.txt
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"'

dast_zap_scan:
  stage: dast-and-deploy
  image: zaproxy/zap-stable:latest
  script:
    - mkdir -p zap-output
    - zap-baseline.py -t http://localhost:8080 -r zap-report.html -J zap-report.json -I || true
  artifacts:
    name: "dast-report-$CI_COMMIT_SHORT_SHA"
    when: always
    paths:
      - zap-output/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

production_deploy_approval:
  stage: dast-and-deploy
  image: alpine:latest
  needs:
    - container_vulnerability_scan
    - dast_zap_scan
  script:
    - echo "Deploying revision $CI_COMMIT_SHORT_SHA to AWS ECS Fargate via OIDC"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
