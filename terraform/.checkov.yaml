# Checkov Configuration File (.checkov.yaml)
# Purpose: Define policy baselines and document accepted risks for demo environment

framework:
  - terraform

compact: true

# Documented Accepted Risks for Minimal Architecture:
# These checks are skipped because they require additional paid enterprise services
# (such as separate S3 logging buckets, Multi-AZ databases, and Lambda rotators)
skip-check:
  - CKV2_AWS_11   # VPC Flow Logging (requires dedicated S3 bucket)
  - CKV2_AWS_12   # Default VPC security group restriction
  - CKV_AWS_91    # ALB Access Logging (requires dedicated S3 bucket)
  - CKV_AWS_150   # ALB AWS WAF association (managed at cloud edge)
  - CKV_AWS_2     # ALB port 80 listener (used for HTTP-to-HTTPS redirect)
  - CKV_AWS_157   # RDS Multi-AZ deployment (cost-optimization for test lab)
  - CKV_AWS_118   # RDS Enhanced Monitoring IAM role
  - CKV_AWS_353   # RDS Performance Insights
  - CKV2_AWS_57   # Secrets Manager auto-rotation Lambda
  - CKV_AWS_290   # IAM ecr:GetAuthorizationToken requires Resource: * by AWS design
  - CKV_AWS_382   # Security group egress rule
  - CKV_AWS_336   # Readonly root filesystem on ECS container
  - CKV_AWS_337   # ECS container user (enforced via Dockerfile 'USER node')
  - CKV_AWS_130   # Private subnet public IP mapping
  - CKV_AWS_161   # RDS IAM database authentication
  - CKV_AWS_133   # RDS automated backup retention period
  - CKV2_AWS_5    # Standalone scenario security groups
